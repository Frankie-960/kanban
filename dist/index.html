<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采购工作看板</title>
    <script type="module" crossorigin src="/assets/index-BDuD1HXq.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CAGwy2gK.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    // Enhancement layer — injects UI elements that require backend features
    // added after build (forgot-password, admin reset-password).
    (function () {
      var INJECTED = {};

      // ── Login page: "忘记密码？" link ───────────────────────────────────────
      function injectForgotLink() {
        if (localStorage.getItem('token')) return; // already logged in
        if (INJECTED.fp) return;

        // Active tab pane submit button (login tab only, not register)
        var tabPane = document.querySelector('.ant-tabs-tabpane-active');
        if (!tabPane) return;
        var btn = tabPane.querySelector('button[type="submit"]');
        if (!btn) return;
        // Register tab has a "name" field; login does not — use this to disambiguate
        if (tabPane.querySelector('input[id*="name"]')) return;

        var wrap = document.createElement('div');
        wrap.id = 'fp-inject';
        wrap.style.cssText = 'text-align:right;margin-top:-8px;margin-bottom:16px;';
        wrap.innerHTML = '<a href="/forgot-password" style="font-size:13px;color:#2563eb;text-decoration:none;">忘记密码？</a>';

        // Insert before the submit button's parent form-item
        var formItem = btn.closest('.ant-form-item') || btn.parentNode;
        formItem.parentNode.insertBefore(wrap, formItem);
        INJECTED.fp = true;
      }

      // ── Admin page: floating "密码重置管理" button ─────────────────────────
      function injectAdminResetBtn() {
        if (INJECTED.adminBtn) return;
        // Confirm we're really on the admin user-management page
        var heading = document.querySelector('h2');
        if (!heading) return;
        // The heading text may be garbled (GBK in UTF-8 bundle) — just check
        // that we're at /admin and a heading + table exist
        if (!document.querySelector('.ant-table')) return;

        var fab = document.createElement('button');
        fab.id = 'admin-reset-fab';
        fab.title = '用户密码重置管理';
        fab.style.cssText = [
          'position:fixed;bottom:28px;right:28px;z-index:9999',
          'background:#2563eb;color:#fff;border:none;border-radius:10px',
          'padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer',
          'box-shadow:0 4px 16px rgba(37,99,235,.35)',
          'display:flex;align-items:center;gap:8px;transition:background .2s',
        ].join(';');
        fab.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>密码重置管理';
        fab.onmouseenter = function () { fab.style.background = '#1d4ed8'; };
        fab.onmouseleave = function () { fab.style.background = '#2563eb'; };
        fab.onclick = function () { window.location.href = '/admin/users'; };
        document.body.appendChild(fab);
        INJECTED.adminBtn = true;
      }

      // ── Route change detection (SPA) ────────────────────────────────────────
      var lastPath = '';
      function cleanup() {
        ['fp-inject', 'admin-reset-fab'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.remove();
        });
        INJECTED = {};
      }

      setInterval(function () {
        var path = window.location.pathname;
        if (path !== lastPath) {
          cleanup();
          lastPath = path;
        }
        if (path === '/' || path === '/login') injectForgotLink();
        if (path === '/admin') injectAdminResetBtn();
      }, 400);
    })();
    </script>
  </body>
</html>
