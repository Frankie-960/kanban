<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采购工作看板</title>
    <script type="module" crossorigin src="/assets/index-BDuD1HXq.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CAGwy2gK.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
    (function () {
      var shown = {};

      // ── 登录页：显示"忘记密码？"链接 ────────────────────────────────────────
      // 触发条件：页面存在 input[type=password]（即登录/注册表单已渲染）
      // 不检查 localStorage token——用户看到登录表单就代表需要这个入口
      function showForgotLink() {
        if (shown.fp) return;
        if (!document.querySelector('input[type="password"]')) return;

        var el = document.createElement('div');
        el.id = 'fp-overlay';
        el.style.cssText = [
          'position:fixed;bottom:0;left:0;right:0',
          'display:flex;justify-content:center',
          'padding:20px;pointer-events:none;z-index:9998',
        ].join(';');
        el.innerHTML = '<a href="/forgot-password" id="fp-link" style="'
          + 'pointer-events:auto;font-size:13px;color:#2563eb;'
          + 'background:rgba(255,255,255,0.95);backdrop-filter:blur(4px);'
          + 'padding:7px 20px;border-radius:20px;'
          + 'box-shadow:0 2px 12px rgba(0,0,0,0.12);'
          + 'text-decoration:none;font-weight:500;'
          + 'border:1px solid #dbeafe;'
          + '">忘记密码？</a>';
        document.body.appendChild(el);
        shown.fp = true;
      }

      function hideForgotLink() {
        var el = document.getElementById('fp-overlay');
        if (el) { el.remove(); shown.fp = false; }
      }

      // ── 管理员用户管理页：右下角"密码重置管理"浮动按钮 ──────────────────
      function showAdminBtn() {
        if (shown.adminBtn) return;
        if (!document.querySelector('.ant-table')) return;

        var fab = document.createElement('button');
        fab.id = 'admin-reset-fab';
        fab.style.cssText = [
          'position:fixed;bottom:28px;right:28px;z-index:9999',
          'background:#2563eb;color:#fff;border:none;border-radius:10px',
          'padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer',
          'box-shadow:0 4px 16px rgba(37,99,235,.35)',
          'display:flex;align-items:center;gap:8px',
        ].join(';');
        fab.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"'
          + ' stroke="currentColor" stroke-width="2.5">'
          + '<rect x="3" y="11" width="18" height="11" rx="2"/>'
          + '<path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>密码重置管理';
        fab.onmouseenter = function () { this.style.background = '#1d4ed8'; };
        fab.onmouseleave = function () { this.style.background = '#2563eb'; };
        fab.onclick = function () { window.location.href = '/admin/users'; };
        document.body.appendChild(fab);
        shown.adminBtn = true;
      }

      function hideAdminBtn() {
        var el = document.getElementById('admin-reset-fab');
        if (el) { el.remove(); shown.adminBtn = false; }
      }

      // ── 路由监听 ──────────────────────────────────────────────────────────
      var lastPath = location.pathname;

      function tick() {
        var path = location.pathname;
        if (path !== lastPath) {
          hideForgotLink();
          hideAdminBtn();
          lastPath = path;
        }
        // 登录页：只要看到密码框就显示链接
        if (path === '/' || path === '/login') {
          showForgotLink();
        }
        // 管理员页
        if (path === '/admin') {
          showAdminBtn();
        }
      }

      // 拦截 SPA 路由跳转
      ['pushState', 'replaceState'].forEach(function (fn) {
        var orig = history[fn];
        history[fn] = function () { orig.apply(this, arguments); tick(); };
      });
      window.addEventListener('popstate', tick);

      // 登录成功后 Vue 会跳路由，届时 tick() 会自动清理链接
      setInterval(tick, 400);
    })();
    </script>
  </body>
</html>
