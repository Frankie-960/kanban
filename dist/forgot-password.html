<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘记密码 — 采购工作看板</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-title {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin-top: 8px;
    }
    .logo-sub { font-size: 13px; color: #64748b; margin-top: 2px; }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .desc { font-size: 14px; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; color: #1e293b; background: #fff;
      outline: none; transition: border-color .2s;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .form-group { margin-bottom: 20px; }
    .btn {
      width: 100%; padding: 11px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #2563eb; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .alert {
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; margin-bottom: 20px; display: none;
    }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .divider { height: 1px; background: #e2e8f0; margin: 24px 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">采购工作看板</div>
    <div class="logo-sub">Procurement Kanban</div>
  </div>
  <div class="divider"></div>

  <h1>重置密码</h1>
  <p class="desc">输入您的账号邮箱，我们将发送重置链接到该邮箱。</p>

  <div id="alert-success" class="alert alert-success">
    重置链接已发送！请检查您的邮箱（含垃圾邮件箱）。<br/>
    <small style="color:#15803d">如果邮箱地址已注册，您将在几分钟内收到邮件。</small>
  </div>
  <div id="alert-error" class="alert alert-error"></div>

  <form id="form">
    <div class="form-group">
      <label for="email">邮箱地址</label>
      <input type="email" id="email" placeholder="your@email.com" required autofocus />
    </div>
    <button type="submit" class="btn" id="btn">发送重置链接</button>
  </form>

  <a href="/" class="back">← 返回登录</a>
</div>

<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const successEl = document.getElementById('alert-success');
  const errorEl = document.getElementById('alert-error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    btn.disabled = true;
    btn.textContent = '发送中…';
    successEl.style.display = 'none';
    errorEl.style.display = 'none';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      if (res.ok) {
        form.style.display = 'none';
        successEl.style.display = 'block';
      } else {
        const data = await res.json();
        errorEl.textContent = data.error || '发送失败，请稍后重试';
        errorEl.style.display = 'block';
      }
    } catch {
      errorEl.textContent = '网络错误，请检查连接后重试';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '发送重置链接';
    }
  });
</script>
</body>
</html>
