<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置新密码 — 采购工作看板</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 36px; width: 100%; max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-title { font-size: 18px; font-weight: 600; color: #1e293b; margin-top: 8px; }
    .logo-sub { font-size: 13px; color: #64748b; margin-top: 2px; }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .desc { font-size: 14px; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; color: #1e293b; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .form-group { margin-bottom: 20px; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .strength { height: 4px; border-radius: 2px; margin-top: 6px; background: #e2e8f0; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }
    .btn {
      width: 100%; padding: 11px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; display: none; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-warn    { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .divider { height: 1px; background: #e2e8f0; margin: 24px 0; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #2563eb; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .countdown { font-weight: 700; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">采购工作看板</div>
    <div class="logo-sub">Procurement Kanban</div>
  </div>
  <div class="divider"></div>

  <div id="alert-invalid" class="alert alert-warn" style="display:block">
    正在验证重置链接…
  </div>
  <div id="alert-success" class="alert alert-success"></div>
  <div id="alert-error" class="alert alert-error"></div>

  <div id="main" style="display:none">
    <h1>设置新密码</h1>
    <p class="desc">请输入您的新密码，设置完成后可用新密码登录。</p>

    <form id="form">
      <div class="form-group">
        <label for="password">新密码</label>
        <input type="password" id="password" placeholder="至少 6 位字符" required minlength="6" autofocus />
        <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>
        <div class="hint" id="strength-text">请输入密码</div>
      </div>
      <div class="form-group">
        <label for="confirm">确认新密码</label>
        <input type="password" id="confirm" placeholder="再次输入新密码" required />
      </div>
      <button type="submit" class="btn" id="btn">确认修改</button>
    </form>
  </div>

  <a href="/" class="back" id="back-link" style="display:none">← 返回登录</a>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const invalidEl = document.getElementById('alert-invalid');
  const successEl = document.getElementById('alert-success');
  const errorEl   = document.getElementById('alert-error');
  const mainEl    = document.getElementById('main');
  const backLink  = document.getElementById('back-link');

  if (!token) {
    invalidEl.textContent = '链接无效：缺少重置凭证，请重新申请密码重置。';
    backLink.style.display = 'block';
  } else {
    invalidEl.textContent = '正在验证重置链接…';
    // Token validation happens when submitting; just show the form
    setTimeout(() => {
      invalidEl.style.display = 'none';
      mainEl.style.display = 'block';
    }, 400);
  }

  // Password strength indicator
  document.getElementById('password').addEventListener('input', function () {
    const val = this.value;
    const bar = document.getElementById('strength-bar');
    const txt = document.getElementById('strength-text');
    if (val.length === 0) {
      bar.style.width = '0'; bar.style.background = '#e2e8f0'; txt.textContent = '请输入密码'; return;
    }
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { pct: '20%', color: '#ef4444', label: '太短' },
      { pct: '40%', color: '#f97316', label: '弱' },
      { pct: '60%', color: '#eab308', label: '一般' },
      { pct: '80%', color: '#22c55e', label: '较强' },
      { pct: '100%', color: '#16a34a', label: '强' },
    ];
    const lvl = levels[Math.min(score - 1, 4)] || levels[0];
    bar.style.width = lvl.pct; bar.style.background = lvl.color; txt.textContent = '密码强度：' + lvl.label;
  });

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn = document.getElementById('btn');
    errorEl.style.display = 'none';

    if (password !== confirm) {
      errorEl.textContent = '两次输入的密码不一致'; errorEl.style.display = 'block'; return;
    }
    if (password.length < 6) {
      errorEl.textContent = '密码至少需要 6 位字符'; errorEl.style.display = 'block'; return;
    }

    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password }),
      });
      const data = await res.json();
      if (res.ok) {
        mainEl.style.display = 'none';
        successEl.innerHTML = '密码修改成功！<span class="countdown" id="cd">3</span> 秒后自动跳转登录页…';
        successEl.style.display = 'block';
        backLink.style.display = 'block';
        let s = 3;
        const iv = setInterval(() => { s--; document.getElementById('cd').textContent = s; if (s <= 0) { clearInterval(iv); location.href = '/'; } }, 1000);
      } else {
        errorEl.textContent = data.error || '重置失败，链接可能已过期，请重新申请';
        errorEl.style.display = 'block';
        if (res.status === 400) backLink.style.display = 'block';
      }
    } catch {
      errorEl.textContent = '网络错误，请检查连接后重试';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = '确认修改';
    }
  });
</script>
</body>
</html>
