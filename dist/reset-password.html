<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置新密码 — 采购工作看板</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 36px; width: 100%; max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-title { font-size: 18px; font-weight: 600; color: #1e293b; margin-top: 8px; }
    .logo-sub { font-size: 13px; color: #64748b; margin-top: 2px; }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    .desc { font-size: 14px; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; color: #1e293b; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .form-group { margin-bottom: 20px; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .strength { height: 4px; border-radius: 2px; margin-top: 6px; background: #e2e8f0; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }
    .btn {
      width: 100%; padding: 11px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; display: none; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-warn    { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .divider { height: 1px; background: #e2e8f0; margin: 24px 0; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #2563eb; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .countdown { font-weight: 700; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">采购工作看板</div>
    <div class="logo-sub">Procurement Kanban</div>
  </div>
  <div class="divider"></div>

  <div id="alert-invalid" class="alert alert-warn" style="display:block">
    正在验证重置链接…
  </div>
  <div id="alert-success" class="alert alert-success"></div>
  <div id="alert-error" class="alert alert-error"></div>

  <div id="main" style="display:none">
    <h1>设置新密码</h1>
    <p class="desc">请输入您的新密码，设置完成后可用新密码登录。</p>

    <form id="form">
      <div class="form-group">
        <label for="password">新密码</label>
        <input type="password" id="password" placeholder="至少 6 位字符" required minlength="6" autofocus />
        <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>
        <div class="hint" id="strength-text">请输入密码</div>
      </div>
      <div class="form-group">
        <label for="confirm">确认新密码</label>
        <input type="password" id="confirm" placeholder="再次输入新密码" required />
      </div>
      <button type="submit" class="btn" id="btn">确认修改</button>
    </form>
  </div>

  <a href="/" class="back" id="back-link" style="display:none">← 返回登录</a>
</div>
<script src="/reset-password.js"></script>
</body>
</html>
